<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Void</title>
<style>
:root{--bg:#080910;--s1:#0D1020;--s2:#15182A;--line:#262a42;--ac:#9147FF;--ac2:#B36BFF;--tx:#F5F5FA;--mu:#A4A5B5;--ok:#39D98A;--er:#FF5252;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac2)}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 96px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;justify-content:center;background:var(--s1);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;max-width:200px;background:none;border:0;border-radius:10px;padding:10px;color:var(--mu);cursor:pointer;font-weight:600}
nav button.on{background:var(--s2);color:var(--tx);box-shadow:inset 0 -2px 0 var(--ac)}
@media(min-width:760px){nav{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:flex-start;padding:10px 24px}nav button{flex:none;padding:8px 18px}.wrap{padding-top:76px}}
h1{font-size:26px;margin:8px 0 4px;letter-spacing:-.02em}
h2{font-size:19px;margin:0 0 10px}
.mu{color:var(--mu)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
input,select,textarea{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac2);outline-offset:1px}
.bar input{flex:1 1 220px;width:auto}.bar select{width:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--s1);color:var(--mu);border-radius:99px;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn{background:var(--ac);border:0;color:#fff;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--ac2)}
.btn.sec{background:var(--s2);border:1px solid var(--line)}.btn.sec:hover{background:var(--line)}
.btn.bad{background:none;border:1px solid var(--er);color:var(--er)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s;text-align:left;padding:0;display:block;width:100%}
.card:hover{border-color:var(--ac)}
.th{aspect-ratio:16/9;background:var(--s2) center/cover;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:13px}
.cb{padding:12px}
.cb b{display:block;font-size:16px}
.cb p{margin:6px 0;color:var(--mu);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mu)}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--s2);border:1px solid var(--line);color:var(--mu)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.er{color:var(--er);border-color:var(--er)}.tag.ac{color:var(--ac2);border-color:var(--ac)}
.empty{text-align:center;padding:64px 16px;border:1px dashed var(--line);border-radius:16px;background:var(--s1)}
.empty h2{font-size:22px;letter-spacing:.04em}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list>div{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list .th{width:96px;flex:none;border-radius:8px}
.list .m{flex:1 1 160px;min-width:0}
.hero{aspect-ratio:16/9;border-radius:16px;background:var(--s2) center/cover;margin:10px 0;display:flex;align-items:center;justify-content:center;color:var(--mu)}
.note{border-left:3px solid var(--ac);padding:8px 12px;background:var(--s1);border-radius:0 8px 8px 0;color:var(--mu);font-size:13px;margin:10px 0}
.err{color:var(--er);font-size:13px;margin-top:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--s2);border:1px solid var(--ac);padding:10px 16px;border-radius:10px;z-index:9;display:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:none}
body.fx #bg{display:block}
.auth{min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center}
.authbox{width:100%;max-width:400px;background:rgba(13,16,32,.84);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;padding:24px}
.logo{margin:0 0 2px;text-align:center}.logo img{width:230px;max-width:80%;height:auto;display:inline-block;filter:drop-shadow(0 0 14px rgba(145,71,255,.5))}
.tabs{display:flex;background:var(--s2);border-radius:10px;padding:3px;margin:16px 0 4px}
.tabs button{flex:1;border:0;background:none;color:var(--mu);padding:8px;border-radius:8px;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--ac);color:#fff}
.hh{padding:28px 0 4px}.hh h1{font-size:clamp(28px,6vw,44px)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
.tile{background:rgba(13,16,32,.84);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;cursor:pointer;color:inherit}
.tile:hover{border-color:var(--ac)}.tile b{display:block;font-size:17px;margin-bottom:4px}
@media(min-width:760px){nav .out{margin-left:auto}}
.wide{width:100%;margin-top:14px}.sm{font-size:12px}
.lnk{background:none;border:0;color:var(--ac2);cursor:pointer;padding:8px 0;font-size:13px;display:block;margin:6px auto 0}
.or{text-align:center;color:var(--mu);font-weight:700;margin:10px 0}
.who{display:flex;justify-content:space-between;align-items:center;background:var(--s2);border-radius:10px;padding:8px 12px;margin-top:14px;font-weight:600}.who .lnk{margin:0}
.authbox h2{margin:16px 0 0;font-size:20px}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.wm{display:flex;align-items:center}.wm img{height:46px;width:auto;display:block;margin:-6px 0}
.ib{background:none;border:0;color:var(--tx);padding:8px;border-radius:10px;cursor:pointer;display:flex}.ib:hover{background:var(--s2)}
.ptabs{overflow-x:auto;display:flex;border-bottom:1px solid var(--line);margin:8px 0 16px}
.ptabs button{flex:1;background:none;border:0;color:var(--mu);padding:12px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
.ptabs button.on{color:var(--tx);border-color:var(--ac)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:700px){.g2{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}
.rk{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;cursor:pointer;color:inherit}
.rk:hover{border-color:var(--ac)}.rk .th{width:96px;flex:none;border-radius:8px}.rk .n{width:22px;text-align:center;font-weight:700;color:var(--mu)}.rk .m{min-width:0}.rk b{display:block}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#3c2a8f);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;flex:none}
.srow{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);color:var(--tx);padding:16px 4px;font-weight:600;cursor:pointer;text-align:left;font-size:16px}
.srow[disabled]{color:var(--mu);cursor:default}.srow:not([disabled]):hover{color:var(--ac2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:12px;color:var(--mu)}.stats b{display:block;font-size:18px;color:var(--tx)}
.back{background:none;border:0;color:var(--tx);cursor:pointer;display:flex;align-items:center;gap:4px;padding:6px 0;font-weight:600}
#dr{display:none;position:fixed;inset:0;z-index:20}#dr.open{display:flex}
#dr .dim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#dr aside{position:relative;width:min(310px,84vw);background:var(--s1);border-right:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto;animation:sl .2s ease-out}
@keyframes sl{from{transform:translateX(-100%)}}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
@media(min-width:760px){nav button{flex-direction:row;gap:8px;font-size:15px}}
.bd{display:grid;grid-template-columns:1.5fr 1fr 1.2fr;gap:8px}
[hidden]{display:none!important}
#pl{position:fixed;inset:0;z-index:50;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
#gc{width:100%;height:100%;display:block;touch-action:none}
#ld{position:absolute;inset:0;z-index:3;background:var(--bg);display:flex;align-items:center;justify-content:center}
.ldbg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(14px) brightness(.45);transform:scale(1.1)}
.ldc{position:relative;text-align:center;width:min(440px,88vw)}
.ldc img{width:100%;border-radius:14px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.ldc h1{font-size:28px;margin:16px 0 2px}
.bar2{height:6px;background:var(--s2);border-radius:99px;overflow:hidden;margin:16px 0 8px}
.bar2 i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
#hud{position:absolute;top:0;left:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;z-index:2}
#hud .ib{background:rgba(13,16,32,.7);border:1px solid var(--line)}
#pm{position:absolute;inset:0;z-index:4;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#pm .panel{width:min(340px,100%);margin:0}#pm .btn{margin-top:10px}
#js{position:absolute;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(32px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(245,245,250,.1);border:1px solid rgba(245,245,250,.25);touch-action:none;z-index:2}
#jk{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:rgba(145,71,255,.7)}
#jb{position:absolute;right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(52px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;background:rgba(145,71,255,.55);border:1px solid rgba(245,245,250,.35);color:#fff;font-weight:700;touch-action:none;z-index:2}
#hud{display:flex;gap:8px;align-items:flex-start}
#plp{position:absolute;top:100%;left:12px;width:min(280px,86vw);margin:6px 0 0}
#sp{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
#sp .panel{width:min(360px,100%);margin:0}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--ac);height:28px}
.pmw{width:min(920px,100%);max-height:100%;overflow:auto;background:rgba(13,16,32,.94);border:1px solid var(--line);border-radius:16px;padding:0 16px 16px}
.pt{display:flex;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.pt button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);padding:16px 10px;font-weight:600;cursor:pointer;white-space:nowrap;font-size:15px}
.pt button.on{color:var(--tx);border-color:var(--tx)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.pcs{display:flex;gap:10px;flex-wrap:wrap}
.pc{background:var(--s2);border-radius:12px;padding:10px;text-align:center;width:160px}.pc img{height:150px;display:block;margin:0 auto 6px}.pc b{display:block;overflow:hidden;text-overflow:ellipsis}
@keyframes fi{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{from{opacity:0;transform:scale(.95)}}
@keyframes fd{from{opacity:0}}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(12px)}}
#app.an>*{animation:fi .32s cubic-bezier(.2,.7,.2,1) both}
#app.an>*:nth-child(2){animation-delay:.04s}#app.an>*:nth-child(3){animation-delay:.08s}#app.an>*:nth-child(n+4){animation-delay:.12s}
.an .grid>*,.an .rk{animation:fi .36s cubic-bezier(.2,.7,.2,1) both}
.an .grid>*:nth-child(n+2),.an .rk:nth-of-type(n+2){animation-delay:.06s}.an .grid>*:nth-child(n+4),.an .rk:nth-of-type(n+4){animation-delay:.12s}.an .grid>*:nth-child(n+7),.an .rk:nth-of-type(n+7){animation-delay:.18s}
.card,.tile,.rk{transition:border-color .15s,transform .18s,box-shadow .18s}
.btn,.chip,nav button,.srow,.ib,.tabs button,.ptabs button,.pt button{transition:background .15s,color .15s,border-color .15s,transform .12s,box-shadow .15s}
@media(hover:hover){.card:hover,.tile:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.35)}.rk:hover{transform:translateX(3px)}}
.btn:active,.chip:active,.tile:active,.card:active,.ib:active{transform:scale(.97)}
.authbox,.empty{animation:pop .38s cubic-bezier(.2,.7,.2,1) both}
#toast{animation:tin .22s ease-out}
#dr .dim{animation:fd .2s ease-out}
.pmw{animation:pop .2s ease-out}.ldc{animation:pop .4s ease-out both}#pl{animation:fd .25s ease-out}
#hud .ib.logo-btn{padding:0;width:58px;height:58px;border:0;background:transparent;border-radius:14px;overflow:visible;transition:transform .15s,filter .15s}#hud .logo-btn img{height:58px;width:58px;object-fit:contain;display:block;pointer-events:none;filter:drop-shadow(0 0 6px rgba(145,71,255,.7))}#hud .logo-btn:hover,#hud .logo-btn:focus-visible{transform:scale(1.08) rotate(-4deg);filter:brightness(1.2)}#hud .logo-btn:active{transform:scale(.94)}
#hb{display:none!important}
#invpanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min( min(560px, calc(100vw - 28px)), calc(100vw - 28px));max-height:min(72vh,620px);overflow:auto;z-index:30;background:rgba(13,16,32,.96);border:1px solid rgba(174,130,255,.45);border-radius:18px;padding:16px;box-shadow:0 18px 60px #0009;backdrop-filter:blur(16px)}
#invpanel[hidden]{display:none}#invhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}#invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:9px}.invitem{min-height:82px;border:1px solid var(--line);border-radius:12px;background:#20243a;color:#fff;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;touch-action:pan-y}.invitem img{width:42px;height:42px;object-fit:contain}.invitem.equipped{border-color:#a66cff;box-shadow:inset 0 0 0 1px #a66cff}.invitem.dragging{opacity:.35}.invitem.dropmark{outline:2px solid #b68aff}.invempty{color:#aab0c4;font-size:13px;padding:16px 4px}#invbtn,#fpbtn{position:absolute;z-index:8;right:14px;top:76px;border:1px solid #ffffff35;border-radius:12px;padding:10px 13px;background:#171b2c;color:white;font-weight:700}#fpbtn{top:126px}#invbtn.on{background:#542b91}#kh span:nth-child(3){display:none}
.mob #invbtn,.mob #fpbtn{top:auto;right:12px;bottom:calc(180px + env(safe-area-inset-bottom,0px));font-size:12px;padding:9px 11px}.mob #fpbtn{bottom:calc(128px + env(safe-area-inset-bottom,0px))}
.hbs{position:relative;width:52px;height:52px;border-radius:10px;background:rgba(13,16,32,.78);border:1px solid var(--line);padding:0;cursor:pointer;overflow:hidden}
.hbs img{width:100%;height:100%;object-fit:contain;padding:6px}
.hbs.empty{cursor:default;opacity:.35}
.hbs.on{border-color:var(--ac);box-shadow:0 0 0 2px rgba(145,71,255,.55),0 0 14px rgba(145,71,255,.5)}
.hbk{position:absolute;top:2px;left:4px;font-size:10px;font-weight:700;color:var(--mu);text-shadow:0 1px 2px #000}
.hbs.on .hbk{color:#fff}
@media(min-width:760px){#hb{bottom:24px}}
nav{background:rgba(13,16,32,.88);backdrop-filter:blur(14px)}
nav button{border-radius:99px}nav button.on{background:var(--s2);box-shadow:none;color:#fff}
.greet{display:flex;align-items:center;gap:12px;margin:4px 0 18px}.greet .av{width:48px;height:48px;font-size:19px}.greet b{font-size:20px}
.hrow{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px}.hrow>.card{flex:0 0 150px;scroll-snap-align:start}
@media(min-width:760px){.hrow>.card{flex-basis:168px}}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card.rb{background:none;border:0;overflow:visible;border-radius:14px}
.card.rb .th{aspect-ratio:1/1;border-radius:14px;border:1px solid var(--line);transition:border-color .15s}

.card.rb .cb{padding:8px 2px 0}.card.rb b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.rb .st{gap:2px 12px;margin-top:3px}.card.rb .st span{display:inline-flex;align-items:center;gap:4px}
.btn.play{background:#00b06f;font-size:18px;padding:14px 36px;flex:1 1 100%;border-radius:12px}.btn.play:hover{background:#00c985}
.hero{border-radius:18px;border:1px solid var(--line)}

.pmw{border-radius:20px}

.grid>.panel{transition:transform .18s,border-color .18s}@media(hover:hover){.grid>.panel:hover{transform:translateY(-3px);border-color:var(--ac)}}
.an .grid>.panel.bought{animation:bump .55s cubic-bezier(.2,1.6,.4,1)}@keyframes bump{40%{transform:scale(1.06);border-color:var(--ok);box-shadow:0 0 0 3px rgba(57,217,138,.35)}}
.card.rb .th{overflow:hidden;transition:border-color .15s,transform .25s}.card.rb:hover .th{transform:scale(1.03)}

/* ===== DOM cursor ===== */
html.hasmouse,html.hasmouse *{cursor:none!important}
#mc{position:fixed;left:0;top:0;width:0;height:0;z-index:2147483647;pointer-events:none;display:none}

/* ===== animations everywhere ===== */
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes pop2{0%{transform:scale(.5)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes wave{0%{transform:rotate(-18deg) skewY(-10deg)}35%{transform:rotate(12deg) skewY(8deg)}70%{transform:rotate(-6deg)}100%{transform:none}}
@keyframes spin3{to{transform:rotateY(360deg)}}
.grid>*,.rk,.si,.pc,.panel,.note,.empty,.stats div,.tile,.authbox{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
.grid>*:nth-child(2){animation-delay:0.090s}.grid>*:nth-child(3){animation-delay:0.135s}.grid>*:nth-child(4){animation-delay:0.180s}.grid>*:nth-child(5){animation-delay:0.225s}.grid>*:nth-child(6){animation-delay:0.270s}.grid>*:nth-child(7){animation-delay:0.315s}.grid>*:nth-child(8){animation-delay:0.360s}.grid>*:nth-child(9){animation-delay:0.405s}.grid>*:nth-child(10){animation-delay:0.450s}.grid>*:nth-child(11){animation-delay:0.495s}.grid>*:nth-child(12){animation-delay:0.540s}
h1,h2{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards}
.btn:hover,.chip:hover,.tile:hover,.rk:hover,.si:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(145,71,255,.25)}

.card:hover{transform:translateY(-5px) scale(1.015);box-shadow:0 12px 28px rgba(145,71,255,.3)}
.chip.on,.tabs button.on,nav button.on{animation:pop2 .35s ease-out}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 4px rgba(145,71,255,.25)}
input,select,textarea{transition:box-shadow .2s,border-color .2s}
.av,.empty h2,#hud .logo-btn img{animation:bob 3.2s ease-in-out infinite}
.vbp::before{animation:spin3 2.4s linear infinite}

/* ===== Roblox-style light theme ===== */
:root{--bg:#fff;--s1:#fff;--s2:#f2f4f5;--line:#e3e5e8;--ac:#335fff;--ac2:#2a4fd6;--tx:#393b3d;--mu:#6d6f71;--ok:#00b06f;--er:#d6283c;color-scheme:light}

body{background:#fff;color:var(--tx);font-family:var(--uf,"Builder Sans","Source Sans 3","Segoe UI",system-ui,-apple-system,Roboto,sans-serif)}
body.fx #bg{display:none!important}
h1,h2{font-weight:800;letter-spacing:-.01em}
input,select,textarea{background:#fff;border:1px solid #bdbebe;border-radius:8px}
input:focus,select:focus,textarea:focus{border-color:var(--ac);outline:2px solid rgba(51,95,255,.25)}
.btn{background:var(--ac);border-radius:8px;font-weight:700}.btn:hover{background:var(--ac2)}
.btn.sec{background:#e3e5e8;border:0;color:var(--tx)}.btn.sec:hover{background:#d4d6d9}
.btn[data-act^="play"],.btn.play{background:#00b06f}.btn[data-act^="play"]:hover,.btn.play:hover{background:#009a60}
.acts .btn:nth-child(1){background:#fdecee;border-color:var(--er);color:#c4152b}
.panel,.stats div,.rk,.note{background:#fff;border-color:var(--line);border-radius:8px}
.panel{box-shadow:0 1px 3px rgba(0,0,0,.08)}
.note{background:#f7f7f8}
.tag{background:#f2f4f5;border-color:transparent;color:var(--mu)}
.chip{background:#e3e5e8;border-color:transparent;color:var(--tx);font-weight:600}.chip.on{background:var(--tx);color:#fff}
.ptabs button.on,.pt button.on{color:var(--tx);border-color:var(--tx)}
.empty{background:#f7f7f8;border-color:#d4d6d9}
.card{background:transparent;border:0;border-radius:8px;overflow:visible;box-shadow:none}
.card .th{aspect-ratio:1/1;border-radius:8px;background-color:#e3e5e8;border:0;overflow:hidden;transition:transform .15s,filter .15s}
.card:hover{border-color:transparent}.card:hover .th{filter:brightness(.94);transform:none}
.card .cb{padding:8px 2px 0}.card .cb b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cb p{display:none}.card .st{font-size:12px;color:var(--mu)}
.hrow>.card{flex:0 0 168px}
.hero{border:0;border-radius:8px}
.tile{background:#fff;backdrop-filter:none;border-color:var(--line);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.tile:hover{border-color:var(--ac)}
.authbox{background:#fff;backdrop-filter:none;border-color:var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.12)}
.auth{background:#fff}
.logo img{width:300px;max-width:100%;filter:none}.wm img{height:44px;margin:0;filter:none}
.av{background:linear-gradient(135deg,#335fff,#8ba6ff)}
.greet b{font-size:20px}
.vbp{background:#fff;border:1px solid var(--line);color:var(--tx);box-shadow:none}
.vbp::before{background:radial-gradient(circle at 35% 30%,#7be3b2,#00b06f)}
.rk:hover{border-color:var(--ac)}
.ib:hover{background:#f2f4f5}
.srow{color:var(--tx)}
.tabs{background:#f2f4f5}
#dr .dim{background:rgba(0,0,0,.4)}
#toast{background:#393b3d;color:#fff;border:0}
.sv-hero{background:linear-gradient(125deg,#335fff,#5b82ff);border:0}.sv-kicker{color:#cfdcff}.sv-hero p{color:#eaf0ff}
/* top bar + left sidebar (desktop), bottom tab bar (mobile) */
#rbh{display:none}
.rbm{position:relative;width:22px;height:22px;background:#393b3d;border-radius:5px;transform:rotate(-12deg)}.rbm::after{content:"";position:absolute;inset:7px;background:#fff;border-radius:1px}

}

/* ===== quality of life ===== */
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
a,button,[data-act],.card,.chip,.tile,.rk,.srow,label{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:not(:disabled):active,.card:active,.tile:active,.rk:active{transform:scale(.98)}
.btn,.chip,nav button,.srow{min-height:40px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
::selection{background:rgba(51,95,255,.25)}
::placeholder{color:#9a9c9e}
*{scrollbar-width:thin;scrollbar-color:#c4c6c9 transparent}
#st *,#pl *,#stai *{scrollbar-color:#55565c transparent}
img{-webkit-user-drag:none}
#pl{overscroll-behavior:none}

<div class="panel"><h2>Home page background</h2><div class="pfg">${BG.map(([n,a,c])=>`<button class="sw" style="background:linear-gradient(160deg,${a},${c})" data-act="pfbg" data-a="${a}" data-b="${c}">${n}</button>`).join("")}</div>${ck("bg.on","Use custom background",b.on)}${ck("bg.grad","Gradient",b.grad)}${pr("bg.c1","Color 1",b.c1)}${pr("bg.c2","Color 2",b.c2)}${rg("bg.ang","Gradient angle",b.ang,0,360)}${ck("bg.all","Use on every page",b.all)}</div>
<div class="panel"><h2>Name tag</h2><div class="pfr"><span>Preview</span><span id="ntp" style="${ntCss()};padding:2px 12px;border-radius:99px;font-weight:800">${esc(me.name||"Player")}</span></div>${ck("tag.on","Show my name tag in games",t.on)}${pr("tag.c","Text color",t.c)}${ck("tag.bgon","Background pill",t.bgon)}${pr("tag.bg","Pill color",t.bg)}${rg("tag.sz","Size",t.sz,10,28)}</div>

function account(){return backBtn+`<h1>Account info</h1><div class="panel"><label for="dn">Display name</label><div class="row"><input id="dn" style="flex:1" maxlength="24" value="${esc(me.name)}"><button class="btn sec" data-act="savename">Save</button></div></div>

function nav(){if(!U){$("#nav").innerHTML="";return}
 const on=k=>({home:["home","discover","detail","favs","played"],shop:["shop","inv"],studio:["studio","edit"],profile:["profile","account","security","prefs"]}[k]).includes(V.view);

function card(e){return `<button class="card rb" data-act="open" data-id="${e.id}">${th(e)}<div class="cb"><b>${esc(e.title)}</b><div class="st"><span>${ic2("like")}${(e.likes||0)+(likes.includes(e.id)?1:0)}</span><span>${ic2("user")}${e.players||0}</span></div><span class="mu" style="font-size:12px">${esc(creator(e))}</span></div></button>`}

function discover(){
 const all=exps.filter(e=>LIVE.includes(e.status));
 const q=V.q.trim().toLowerCase();
 let r=all.filter(e=>(!V.genre||e.genre===V.genre)&&(!q||[e.title,creator(e),e.genre].some(s=>s.toLowerCase().includes(q))));
 const likeCount=e=>(e.likes||0);
 if(V.sort==="new")r.sort((a,b)=>b.publishedAt-a.publishedAt);else if(V.sort==="liked")r.sort((a,b)=>likeCount(b)-likeCount(a));else r.sort((a,b)=>(b.visits||0)-(a.visits||0)||b.publishedAt-a.publishedAt);
 const shown=r.slice(0,V.page*12);
 const sug=[...new Set(all.flatMap(e=>[e.title,creator(e)]))];
 let body;
 if(!all.length)body=`<div class="empty"><h2>NO EXPERIENCES YET</h2><p class="mu">Be the first creator to publish something incredible.</p><button class="btn" data-act="go" data-v="studio">Open Studio</button></div>`;
 else if(!r.length)body=`<div class="empty"><h2>No matches</h2><p class="mu">Nothing published matches that search. Clear the filters to see everything.</p><button class="btn sec" data-act="clear">Clear filters</button></div>`;
 else body=`<div class="grid">${shown.map(card).join("")}</div>${r.length>shown.length?`<div style="text-align:center;margin-top:16px"><button class="btn sec" data-act="more">Load more</button></div>`:""}`;
 return `<h1>Discover</h1><div class="mu">Only experiences that creators have published appear here.</div>
 <form class="bar" data-act="search"><input id="q" list="sug" type="search" value="${esc(V.q)}" placeholder="Search title, creator or genre" autocomplete="off"><datalist id="sug">${sug.map(s=>`<option value="${esc(s)}">`).join("")}</datalist>
 <select id="sort" aria-label="Sort"><option value="popular"${V.sort==="popular"?" selected":""}>Popular</option><option value="new"${V.sort==="new"?" selected":""}>New releases</option><option value="liked"${V.sort==="liked"?" selected":""}>Most liked</option></select></form>
 ${recents.length?`<div class="row mu" style="font-size:13px;margin-bottom:8px">Recent: ${recents.map(s=>`<button class="chip" data-act="recent" data-q="${esc(s)}">${esc(s)}</button>`).join("")}<button class="chip" data-act="clrrecent">Clear</button></div>`:""}
 <div class="chips"><button class="chip ${V.genre?"":"on"}" data-act="genre" data-g="">All</button>${GENRES.map(g=>`<button class="chip ${V.genre===g?"on":""}" data-act="genre" data-g="${g}">${g}</button>`).join("")}</div>
 <div style="margin-top:14px">${body}</div>`}

function detail(){
 const e=exps.find(x=>x.id===V.id);
 if(!e||(!LIVE.includes(e.status)&&e.creatorId!==me.id))return `<div class="empty"><h2>Experience unavailable</h2><p class="mu">It may be unpublished, private, or not exist.</p><button class="btn sec" data-act="go" data-v="discover">Back to Discover</button></div>`;
 const liked=likes.includes(e.id);
 return `<button class="btn sec" data-act="go" data-v="discover">Back</button>
 <div class="hero" style="${e.thumb?`background-image:url('${e.thumb}')`:""}">${e.thumb?"":"No thumbnail"}</div>
 <h1>${esc(e.title)}</h1><div class="mu">by <a href="#" data-act="byc" data-q="${esc(creator(e))}">${esc(creator(e))}</a> · ${esc(e.genre)} · v${e.version||0}</div>
 <p>${esc(e.desc)}</p>
 <div class="st" style="font-size:14px;margin:10px 0"><span>${e.players||0} playing</span><span>${e.visits||0} visits</span><span>${(e.likes||0)+(liked?1:0)} likes</span><span>${(e.favs||0)+(ld("void.favs",[]).includes(e.id)?1:0)} favorites</span></div>
 <div class="panel"><h2>Servers</h2><div class="mu">${(e.build==="builtin:base-template"||!!e.world)?"Solo session available. Multiplayer servers aren’t built yet.":"No servers online."}</div>
 <div class="row" style="margin-top:12px"><button class="btn play" data-act="play" data-id="${e.id}"${(e.build==="builtin:base-template"||!!e.world)?"":" disabled"}>Play</button>
 <button class="btn sec rx thumb${liked?" on":""}" data-act="like" data-id="${e.id}" aria-label="${liked?"Remove like":"Like"}" aria-pressed="${liked}" title="Like">${ic("like")}<span>${(e.likes||0)+(liked?1:0)}</span></button><button class="btn sec rx flag${ld("void.favs",[]).includes(e.id)?" on":""}" data-act="fav" data-id="${e.id}" aria-label="${ld("void.favs",[]).includes(e.id)?"Remove from favorites":"Add to favorites"}" aria-pressed="${ld("void.favs",[]).includes(e.id)}" title="Save to favorites">${ic("flag")}</button>
 <button class="btn sec" data-act="report" data-id="${e.id}">Report</button></div>
 <div class="err" style="color:var(--mu)">${(e.build==="builtin:base-template"||!!e.world)?"Play starts a solo session in your browser.":playable(e)?"Multiplayer servers aren’t built yet, so this experience can’t be launched.":"Play is unavailable: the creator hasn’t attached a playable build, and the Project Void Player isn’t built yet."}</div></div>
 <div class="panel"><h2>Update history</h2>${(e.history||[]).slice().reverse().map(h=>`<div class="mu">v${h.v} · ${esc(h.note)} · ${fmt(h.at)}</div>`).join("")||`<div class="mu">No updates yet.</div>`}</div>`}

function studio(){

 const API_DOC=`PROJECT VOID SCRIPT API (JavaScript, runs when a game starts)
Scripts get one global: game. Everything else (window, document, fetch, storage) is blocked.

game.title                      project name (string)
game.time                       seconds since start
game.find("Name")               -> part or null
game.findAll("Prefix")          -> array of parts whose name starts with Prefix
game.parts                      -> array of all parts
game.createPart({name,x,y,z,sx,sy,sz,color,shape,group,canCollide,transparency,kill})
                                shape: "block" | "ball" | "cyl" | "wedge" | "cone" | "torus". y is the CENTER height. Returns a part.
game.onTick(dt => {})           runs every frame (dt = seconds)
game.every(seconds, fn)         repeat; returns id.   game.after(seconds, fn) one-shot; returns id
game.cancel(id)                 stop an every/after timer or tween
game.tween(partOrName, {x,y,z,sx,sy,sz,rotationY,transparency}, seconds, easing)
                                smoothly animates supported part properties; easing: "linear" (default), "smooth", "out"
game.onKey("e", fn)             key pressed (lowercase key name, " " for space)
game.message("text")            toast message to the player
game.hud("text")                text pill at top centre ("" hides it)
game.ui.createPanel({title,x,y,width,background,border,radius,anchor}) creates a styled in-game UI panel.
  panel.addText({text,size,color,bold,align}) adds a text label; returns {setText(text),destroy()}.
  panel.addButton({text,color,background,width,onClick}) adds a clickable button.
  panel.addBar({value,max,color,background,label,height}) adds a progress bar; returns {setValue(value),destroy()}.
  panel.addImage({src,width,height,alt}) adds an image (http/https or data:image URL).
  panel.setVisible(boolean), panel.setTitle(text), panel.destroy().
game.ui.removeAll()                 removes all custom game UI panels.
UI scripts run inside the game. Use game.ui for all menus/HUDs; do not use browser APIs.
game.beep(frequency)            short sound
game.random(min, max)           random number
game.coins / game.totalCoins    coins collected / coins in the world

game.player.x / y / z           position (feet). Assigning teleports the player.
game.player.teleport(x,y,z)
game.player.speed = 1.5         walk-speed multiplier (1 = normal)
game.player.jumpPower = 1.2     jump multiplier (1 = normal)
game.player.jump(power)         launch upward (normal jump is 28)
game.player.boost(vx, vz)       horizontal push
game.player.kill()              respawn at last checkpoint
game.player.setSpawn(x,y,z)     change respawn point
game.player.onGround            true when standing

Part properties (read/write): name, x, y, z (center), sx, sy, sz (size), rotationY (degrees),
  color ("#rrggbb"), transparency (0-1), visible, canCollide, kill
Part methods: part.onTouch(fn)  fn runs once each time the player starts touching it
              part.moveTo(x,y,z) moves and carries the player if standing on it
              part.destroy()

STANDARD LIBRARY (always available, built on the API above):
game.stats.set("Coins", 0) / .add("Coins", 1) / .get("Coins")   live stats panel, top right
game.save("key", value) / game.load("key", default)           persistent progress (per experience, per browser)
game.player.health / maxHealth (read/write), .damage(n), .heal(n), .invulnerable(sec), .showHealth()   health bar appears on first use; at 0 the player respawns with full health
game.onDeath(fn)                          runs when health reaches 0
game.countdown(seconds, {label, onTick(left), onEnd})         HUD countdown timer; returns timer id
game.patrol(partOrName, [[x,y,z],...], speed)                 part walks a looping route
game.chase(partOrName, {speed, range, damage, hit, cooldown}) part follows the player and damages on contact
game.dialog("Name", ["line 1","line 2"], onDone)             click-through dialog box
game.door(partOrName, {y, seconds}) -> {open(), close(), toggle(), isOpen}   sliding door (default lifts by its height)
game.pickups("CoinPrefix", fn(part), respawnSeconds)         collectibles: hide on touch, optional respawn
game.onTouchAny("Prefix", fn(part))                          touch handler for every part with that name prefix

Physics: walk speed 14, jump power 28 (height about 5.6 studs, gap about 9 studs). Gravity 70.
The player is about 2 wide and 5 tall. Y is up. The baseplate top is y = 0.

Example (lava + bounce pad + moving platform):
  const pad = game.find("BouncePad");
  if (pad) pad.onTouch(() => game.player.jump(60));
  const mover = game.find("Mover");
  if (mover) { const x0 = mover.x; game.onTick(() => mover.moveTo(x0 + Math.sin(game.time) * 8, mover.y, mover.z)); }
  game.onKey("e", () => game.message("Hello!"));`;
const AI_SYS=`You are Project Void Studio's senior 3D art director, character modeler, level designer, UI/UX designer and gameplay engineer. You directly edit the user's current 3D world by returning a precise JSON edit plan. Your job is to create recognizable, intentional, polished results—not piles of generic cubes. Operate like a senior Roblox Studio-style co-builder: understand intent, ask no unnecessary questions, plan the result, inspect the current project context, preserve existing work, and output complete coordinated edits. Think through spatial layout, scale, object hierarchy, performance, interaction design, script dependencies, error handling and mobile usability before producing JSON. Prefer complete playable systems over disconnected demonstrations. When a feature depends on an API that is not documented, do not fake it; explain the limitation and build the strongest supported alternative.

CORE QUALITY RULE: Every object must read correctly at a glance. Choose shapes because they fit the object, not because blocks are easiest. Use silhouettes, proportions, color grouping, layered details, and deliberate composition. Never call a rough placeholder a finished model. Do not claim features the runtime cannot support.

PLAN BEFORE BUILDING: Silently identify the requested experience, art style, palette, scale, focal point, player route, interaction points, and what must remain from the existing project. Build in coherent layers: silhouette and layout first; structural forms second; details and trim third; props and visual accents last. Vary size, spacing, orientation, and silhouette. Avoid repetitive grids unless the design calls for them. Keep paths and play space clear.
ROBLOX-STUDIO-LEVEL BUILD THINKING: Treat each request as a complete playable experience, not just a static decoration. For games, design a clear spawn/lobby, player-readable objective, gameplay loop, progression/reward feedback, boundaries, checkpoints or safe zones where appropriate, and a satisfying finish. For environments, build a coherent modular kit with consistent dimensions, repeated architectural language, believable openings, interior/exterior details, signage and navigation landmarks. For characters, props and machines, make the silhouette recognizable from multiple angles and group components by logical naming prefixes. Use Explorer-friendly unique names to keep projects editable. When a request is broad, make sensible creative decisions and deliver a complete first version rather than asking many questions. When an essential detail is genuinely missing, ask one concise clarification. For existing projects, preserve unrelated work and edit only requested systems. For huge builds, split into clearly named zones or systems and state exactly what remains for the next pass; never pretend an incomplete build is complete.

CURRENT WORLD RULES: Y is up. Part x,y,z are CENTER coordinates. Baseplate top is y=0 and spans 256x256. A grounded part's center is y=sy/2. Player is ~2 studs wide and 5 tall; walk speed 14, jump power 28, gravity 70. For fair obbies use 4–7 stud gaps and step-ups <=4. Keep builds near existing spawn and preserve all existing objects unless the user explicitly requests removal. Exactly one spawn should exist; do not create another if one already exists. Coins float about 2 studs above the surface. Mark hazards kl:true and checkpoints cp:true.

- Castle: connected outer wall circuit, gatehouse with open entrance, corner towers, crenellations, central keep, banners, paths; vary tower heights.
- City: coherent road grid, sidewalks, crosswalks, varied building footprints/heights, windows, storefronts, streetlights, signs, trees and street props.
- Trees: visible trunk plus layered canopy clusters with varied sizes; do not use one green cube.
